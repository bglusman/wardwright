- id: RALPH-RBE-001
  source_run: docs/ralph-runs/2026-05-22-read-before-edit-tool-misuse
  type: ui_clarity
  severity: important
  summary: Trace event copy should state the exact read-before-edit violation.
  observed_from_ui: The selected edit_file event says "Suggested fork point before mutating app.txt" but does not explicitly say no read_file evidence existed for app.txt.
  expected_operator_experience: An operator should see the policy failure in plain language at the selected event without inferring it from the tool sequence.
  suggested_next_step: Add a violation summary fact or event annotation that names the missing prior read and target path.
- id: RALPH-RBE-002
  source_run: docs/ralph-runs/2026-05-22-read-before-edit-tool-misuse
  type: missing_capability
  severity: important
  summary: OpenCode was exported as a handoff but not resumed as a native live agent.
  observed_from_ui: The UI produced an OpenCode import command and labeled equivalent agent resume as "no".
  expected_operator_experience: A future pilot should verify whether OpenCode can import the session and continue the task with native tool state preserved.
  suggested_next_step: Add a documented local OpenCode resume procedure or mark the adapter as inspection-only until native resume is proven.
- id: RALPH-RBE-003
  source_run: docs/ralph-runs/2026-05-22-read-before-edit-tool-misuse
  type: reliability
  severity: later
  summary: Simulator case storage was memory-only during the local pilot.
  observed_from_ui: The Control Debugger storage note reported "Simulator cases: memory only; not durable across restart."
  expected_operator_experience: A pilot run should make it clear how to use durable scenario storage when the operator intends to keep evidence.
  suggested_next_step: Document or expose the exact environment variable for file-backed scenario storage in the control debugger setup path.
- id: RALPH-RBE-004
  source_run: docs/ralph-runs/2026-05-22-read-before-edit-tool-misuse
  type: test_gap
  severity: later
  summary: Browser smoke does not yet exercise the control debugger save-scenario path.
  observed_from_ui: The mismatch was caught manually through the Ralph pilot, while existing browser smoke covered responsive rendering and other admin routes.
  expected_operator_experience: The strongest UI regression gate should catch obviously wrong scenario save destinations.
  suggested_next_step: Add a focused browser-smoke assertion for recording read-before-edit and verifying the save message points to tool-governance.
