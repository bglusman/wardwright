- id: RALPH-RBE-002
  source_run: docs/ralph-runs/2026-05-22-read-before-edit-tool-misuse
  carried_by: docs/ralph-runs/2026-05-22-read-before-edit-followups
  status: open
  type: missing_capability
  severity: important
  summary: OpenCode was exported as a handoff but not resumed as a native live agent.
  observed_from_this_run: Wardwright exposes OpenCode adapter fidelity through UI, CLI, and MCP, and all surfaces report equivalent_agent_resume=false.
  expected_operator_experience: A future pilot should either prove native OpenCode import/resume with preserved hidden tool state or label the adapter as inspection-only.
  suggested_next_step: Run a native OpenCode import/resume trial from an exported Wardwright trace, document exact commands and state fidelity, then update adapter status and UI language.
- id: RALPH-RBE-005
  source_run: docs/ralph-runs/2026-05-22-read-before-edit-followups
  status: open
  type: surface_parity
  severity: important
  summary: MCP lacks first-class Control Debugger trace controls for the full Ralph loop.
  observed_from_this_run: MCP now exposes receipt replay and harness export, but recording a built-in counterfactual example, selecting a trace cursor, forking, and saving trace evidence remain UI-first operations.
  expected_operator_experience: An assisting agent should be able to perform the same read-before-edit investigation through MCP or documented API controls without scraping the UI.
  suggested_next_step: Add MCP or HTTP tools for recording a counterfactual example, loading trace events, replaying/forking a selected cursor, and saving selected trace evidence as a simulator case, with explicit input schemas and safety notes.
