name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.0-rc.6"
          gleam-version: "1.17.0"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.22.3"
      - name: Install deps
        run: mix deps.get
        working-directory: app
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: app/_build/assay
          key: ${{ runner.os }}-beam-otp29-elixir120-gleam117-assay-${{ hashFiles('app/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-beam-otp29-elixir120-gleam117-assay-
      - name: Check Gleam formatting
        run: gleam format --check src
        working-directory: app
      - name: Check formatting
        run: mix format --check-formatted
        working-directory: app
      - name: Run Credo ratchets
        run: mix credo --format=oneline
        working-directory: app
      - name: Run Dialyzer
        run: mix assay
        working-directory: app
      - name: Run tests
        run: mix test
        working-directory: app
      - name: Run Lustre browser smoke tests
        env:
          WARDWRIGHT_BROWSER_REQUIRED: "1"
        run: node scripts/browser-smoke/lustre-workbench.mjs

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check docs links
        run: ruby scripts/check-docs-site.rb
      - name: Check UI docs acknowledgement
        run: scripts/check-ui-docs-ack.sh

  packaged-smoke:
    name: packaged smoke
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
      APP_NAME: wardwright
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@8251c48667b97e88a0a24ec512f5b72a039fcea7 # v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.0-rc.6"
          gleam-version: "1.17.0"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.0.5
        with:
          version: "0.15.2"
          use-cache: false
      - name: Install deps
        run: mix deps.get
        working-directory: app
      - name: Build linux packaged binary
        run: mix tinfoil.build --target linux_x86_64 --skip-version-check
        working-directory: app
      - name: Smoke packaged binary
        run: scripts/smoke-burrito-binary.sh app/burrito_out/wardwright_linux_x86_64

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [app, docs, packaged-smoke]
    if: always()
    steps:
      - name: Verify required jobs
        env:
          APP_RESULT: ${{ needs.app.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          PACKAGED_SMOKE_RESULT: ${{ needs.packaged-smoke.result }}
        run: |
          set -euo pipefail
          for result in "$APP_RESULT" "$DOCS_RESULT" "$PACKAGED_SMOKE_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required job failed or was skipped"
              exit 1
            fi
          done
